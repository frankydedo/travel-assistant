name: travel-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: travel
      KC_DB_PASSWORD: travel
      # Tokens are issued for the URL the browser uses; the backend reaches Keycloak on the internal network.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/travel-realm.json:/opt/keycloak/data/import/travel-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ./src/backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://travel:travel@postgres:5432/travel
      OIDC_ISSUER: http://localhost:8080/realms/travel
      OIDC_JWKS_URL: http://keycloak:8080/realms/travel/protocol/openid-connect/certs
      OIDC_AUDIENCE: travel-api
      CHROMA_PATH: /data/chroma
      LOG_FORMAT: json
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: pk-lf-travel-local
      LANGFUSE_SECRET_KEY: sk-lf-travel-local
      LANGFUSE_UI_URL: http://localhost:3001
      LANGFUSE_PROJECT_ID: travel-assistant
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Read-only database UI for the reviewer: read-only role + read-only session, locked to the app database.
  pgweb:
    image: sosedoff/pgweb:0.16.2
    command: ["--readonly", "--lock-session"]
    environment:
      PGWEB_DATABASE_URL: postgres://travel_readonly:travel_readonly@postgres:5432/travel?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: travel
        VITE_KEYCLOAK_CLIENT_ID: travel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - keycloak

  # --- Langfuse v4 self-hosted (ADR-0010) ---------------------------------------------
  # Derived from the official compose. Credentials below are for local development only.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://travel:travel@postgres:5432/langfuse
      SALT: travel-local-salt
      ENCRYPTION_KEY: "7f3a9c1e5b2d8f4a6c0e9b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1a"
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: travel-redis

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "3001:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: travel-local-nextauth-secret
      # Headless initialisation: organisation, project, API keys and an admin user are created at start,
      # so tracing works with `docker compose up` and no account.
      LANGFUSE_INIT_ORG_ID: travel-org
      LANGFUSE_INIT_ORG_NAME: Assistente viaggi
      LANGFUSE_INIT_PROJECT_ID: travel-assistant
      LANGFUSE_INIT_PROJECT_NAME: travel-assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-travel-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-travel-local
      LANGFUSE_INIT_USER_EMAIL: admin@travel.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: travel-langfuse

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: --requirepass travel-redis --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "travel-redis", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  backend-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
