[project]
name = "travel-assistant-backend"
version = "0.1.0"
description = "Backend dell'assistente virtuale per viaggi personalizzati"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "langfuse>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependency injection uses Depends() in defaults by design

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001", "UP035", "UP007"]
