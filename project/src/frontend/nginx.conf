server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: proxy verso il backend mantenendo il prefisso /api.
    # proxy_buffering off per lo streaming SSE.
    # Resolve the backend at request time through Docker's DNS: a recreated backend container gets a new
    # IP, and a name resolved only at startup would keep pointing at the old one (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA: fallback su index.html per le rotte gestite da react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
